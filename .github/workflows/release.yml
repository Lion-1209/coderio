name: Release

# Triggered by pushing a tag like v0.1.0. Builds a wheel and attaches it
# to a GitHub Release, so users can `pip install coderio-*.whl` without
# cloning the repo or going through PyPI.
#
# To cut a release:
#   git tag v0.1.0
#   git push origin v0.1.0

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write  # needed to create the release + upload assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        run: |
          pip install build
          python -m build --wheel

      - name: Verify wheel in clean venv (full deps)
        # Install the wheel WITH all dependencies (not --no-deps) to verify
        # the full user install path. Then run --help + import the deepagents
        # engine + verify bundled skills. This catches missing deps that the
        # old --no-deps + manual 5-package approach missed (deepagents, ddgs,
        # langgraph-checkpoint-sqlite, etc.).
        run: |
          python -m venv /tmp/wheel-test-venv
          /tmp/wheel-test-venv/bin/pip install dist/*.whl
          /tmp/wheel-test-venv/bin/coderio --help
          # Verify the deepagents engine imports (the production path).
          /tmp/wheel-test-venv/bin/python -c "
          from coderio.agent.deep_loop import run_deep_agent
          from coderio.agent.harness_middleware import HarnessMiddleware
          from coderio.agent.permission_middleware import PermissionMiddleware
          from coderio.cli.tui import CoderioTUI
          print('deepagents engine imports OK')
          "
          # Verify bundled skills are importable from the installed package.
          /tmp/wheel-test-venv/bin/python -c "
          from coderio.skills.store import load_skill_store
          from pathlib import Path
          import coderio
          pkg = Path(coderio.__file__).parent / 'skills'
          store = load_skill_store(pkg, 0, None)
          assert len(store.names()) > 0, 'no bundled skills found'
          print(f'{len(store.names())} bundled skills OK')
          "

      - name: Create GitHub Release + attach wheel
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*.whl
