name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install "ruff>=0.16"
      - name: Ruff check (lint)
        run: ruff check src tests
      - name: Ruff format check
        # --check only verifies, doesn't modify files. Fails if any file
        # isn't formatted — catches "forgot to format" in PRs.
        run: ruff format --check src tests

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    env:
      # Windows runners default to cp1252; Rich/Textual output contains CJK
      # text (Chinese UI strings) that charmap can't encode. Force UTF-8 so
      # `coderio --help` and subprocess-based tests don't crash with
      # UnicodeEncodeError on windows-latest.
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # Install from the pinned lockfile for reproducible builds. The project
        # itself is installed with --no-deps so the locked versions win (without
        # --no-deps, pip would resolve coderio's dependencies fresh and could
        # pick different transitive versions, defeating the lockfile).
        #
        # The lockfile pins main + [dev] extras. To add the [mcp] extra in CI,
        # append `mcp` to the extras and re-pin (see requirements-dev.txt header).
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install --no-deps -e .

      - name: Check dependency consistency
        # Verifies no broken/conflicting requirements after install.
        # Catches version conflicts between deepagents/langchain/langgraph.
        shell: bash
        run: pip check

      - name: Audit dependencies for known vulnerabilities
        # Scans installed packages against the PyPI advisory database.
        # Non-blocking (continue-on-error) — reports issues without failing CI.
        shell: bash
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit --skip-editable

      - name: Run tests with coverage
        # Enforces a coverage floor so coverage can't silently regress.
        # The 70% floor is conservative (current baseline is ~75%) — it catches
        # gross regressions (a module losing its tests) without failing on
        # minor fluctuations. pyproject.toml's [tool.coverage.report]
        # fail_under=60 is the local-dev default; CI enforces the stricter 70%.
        shell: bash
        run: |
          python -m pytest -q --cov=coderio --cov-report=term-missing --cov-fail-under=70

      - name: Type check (mypy)
        # Non-blocking (continue-on-error): gradual typing. The config in
        # pyproject.toml [tool.mypy] is lenient (ignore_missing_imports, no
        # check_untyped_defs) so this catches gross type errors without
        # blocking on every untyped third-party dep. Tighten over time.
        continue-on-error: true
        shell: bash
        run: |
          python -m mypy src/coderio || true

      - name: Build wheel (smoke)
        shell: bash
        run: |
          python -m pip wheel --no-deps . -w /tmp/wheel-test
          echo "Wheel built successfully"
