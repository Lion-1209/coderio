name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install "ruff>=0.16"
      - name: Ruff check (lint)
        run: ruff check src tests
      - name: Ruff format check
        # --check only verifies, doesn't modify files. Fails if any file
        # isn't formatted — catches "forgot to format" in PRs.
        run: ruff format --check src tests

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    env:
      # Windows runners default to cp1252; Rich/Textual output contains CJK
      # text (Chinese UI strings) that charmap can't encode. Force UTF-8 so
      # `coderio --help` and subprocess-based tests don't crash with
      # UnicodeEncodeError on windows-latest.
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v7

      # uv replaces pip for dependency installation (2026-08-14 migration).
      # uv.lock is a first-class lockfile for both uv and Dependabot: CI gets
      # fully reproducible installs (P1-4), while Dependabot updates pyproject
      # constraints AND regenerates uv.lock in its PRs — the two mechanisms
      # cooperate instead of fighting (the bare requirements-dev.txt approach
      # had Dependabot produce internally-inconsistent updates; see PR #6).
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies (locked)
        # --frozen: install EXACTLY what uv.lock pins; error if the lock is
        # out of sync with pyproject.toml (forces committing both together).
        # --extra dev: the dev dependency group (pytest/ruff/mypy/build).
        run: uv sync --frozen --extra dev

      - name: Check dependency consistency
        run: uv run python -m pip check

      - name: Audit dependencies for known vulnerabilities
        # Scans installed packages against the PyPI advisory database.
        # Non-blocking (continue-on-error) — reports issues without failing CI.
        shell: bash
        continue-on-error: true
        run: |
          uv pip install pip-audit
          uv run pip-audit

      - name: Run tests with coverage
        # Enforces a coverage floor so coverage can't silently regress.
        # The 70% floor is conservative (current baseline is ~75%) — it catches
        # gross regressions (a module losing its tests) without failing on
        # minor fluctuations. pyproject.toml's [tool.coverage.report]
        # fail_under=60 is the local-dev default; CI enforces the stricter 70%.
        shell: bash
        run: |
          uv run python -m pytest -q --cov=coderio --cov-report=term-missing --cov-fail-under=70

      - name: Type check (mypy)
        # HARD GATE for clean modules. pyproject.toml's [[tool.mypy.overrides]]
        # lists modules with known type issues (ignore_errors=true) — each is a
        # tracked cleanup TODO. Modules NOT in that list must stay type-clean,
        # so new type errors in clean code fail CI.
        shell: bash
        run: |
          uv run python -m mypy src/coderio

      - name: Build wheel (smoke)
        shell: bash
        run: |
          uv build --wheel -o /tmp/wheel-test
          echo "Wheel built successfully"
