version: 2
updates:
  # Python dependencies — checks pyproject.toml for updates
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
    # Group minor/patch updates to reduce PR noise
    groups:
      minor-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions — keeps workflow action versions current
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "ci"
    commit-message:
      prefix: "ci"
